services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pneumopred-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
